packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  "@biomejs/biome": true
  '@google/genai': true
  "@prisma/client": true
  "@prisma/engines": true
  "@tailwindcss/oxide": true
  esbuild: true
  msw: true
  prisma: true
  protobufjs: true

catalog:
  "typescript": "7.0.2"
  "@types/node": "26.6.2"
  "zod": "4.4.3"

# Pin exact versions when adding dependencies (no ^ or ~ ranges).
savePrefix: ""

# Supply-chain hardening. Some of these match pnpm 11 defaults; they are pinned
# here so the policy stays explicit if defaults change.
# Wait a day before resolving newly published versions.
minimumReleaseAge: 1440
# Fail if a package's trust evidence (provenance / trusted publisher) regresses
# compared to its earlier releases.
trustPolicy: no-downgrade
trustPolicyExclude:
  # Legitimate 6.x backport of the ReDoS fix, published without provenance
  # after 7.x releases had it. Pulled in by @babel/core via shadcn.
  - "semver@6.3.1"
# Only direct dependencies may come from git repos or tarball URLs.
blockExoticSubdeps: true
# Fail the install when a dependency has build scripts not listed in allowBuilds.
strictDepBuilds: true
