name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing tag to deploy, e.g. sha-abc1234 (blank = build this commit)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

# Never interrupt a half-finished deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/stden
  MIGRATE_IMAGE: ghcr.io/${{ github.repository_owner }}/stden-migrate
  DEPLOY_HOST: e5pe0n-mini-pc.tail838ed1.ts.net
  DEPLOY_USER: e5pe0n
  DEPLOY_DIR: /opt/stden

jobs:
  build:
    runs-on: ubuntu-latest
    # Skipped when redeploying an existing tag for rollback.
    if: ${{ !inputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: app
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:sha-${{ github.sha }}
            ${{ env.APP_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migration image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: db_migration
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.MIGRATE_IMAGE }}:sha-${{ github.sha }}
            ${{ env.MIGRATE_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    # Run even when `build` was skipped for a rollback, but not if it failed.
    if: ${{ always() && !failure() && !cancelled() }}
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image tag
        id: tag
        env:
          REQUESTED: ${{ inputs.image_tag }}
        run: |
          TAG="${REQUESTED:-sha-${{ github.sha }}}"
          # This value reaches a remote shell, so constrain it to a tag shape
          # rather than trusting workflow_dispatch input.
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::refusing unsafe image tag: $TAG"
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      # Joins the tailnet as an ephemeral, tagged node that is removed
      # automatically when the job ends. Identity comes from the tailnet, so
      # there is no SSH key stored anywhere.
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Copy deployment config
        run: |
          scp -o StrictHostKeyChecking=no deploy/compose.prod.yml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR}/compose.prod.yml"

      - name: Deploy
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          # The heredoc is quoted so the script is expanded on the mini PC,
          # not on the runner; the two values it needs are passed as remote
          # environment variables instead.
          ssh -o StrictHostKeyChecking=no "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "IMAGE_TAG='${IMAGE_TAG}' DEPLOY_DIR='${DEPLOY_DIR}' bash -euo pipefail" <<'REMOTE'
          cd "$DEPLOY_DIR"
          # Rewrite IMAGE_TAG in place, appending it if absent.
          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$IMAGE_TAG|" .env
          else
            echo "IMAGE_TAG=$IMAGE_TAG" >> .env
          fi
          docker compose -f compose.prod.yml pull
          # Blocks on db_migration exiting 0, so a failed migration stops the
          # rollout before new code serves traffic.
          docker compose -f compose.prod.yml up -d --remove-orphans
          docker compose -f compose.prod.yml ps
          REMOTE

      # Runs on the mini PC against loopback, not from the runner: the ACL
      # grants tag:ci port 22 only, so the runner cannot reach :443. Keeping
      # it that way means CI can deploy but can never call the app itself.
      - name: Health check
        run: |
          ssh -o StrictHostKeyChecking=no "${DEPLOY_USER}@${DEPLOY_HOST}" bash -euo pipefail <<'REMOTE'
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/api/health | grep -q '"ok"'; then
              echo "healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed after 60s"
          cd /opt/stden && docker compose -f compose.prod.yml logs --tail=60 app db_migration
          exit 1
          REMOTE

      - name: Prune old images
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'docker image prune -f --filter "until=168h"' || true
