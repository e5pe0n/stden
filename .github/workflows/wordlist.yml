name: Refresh word list

on:
  schedule:
    # 04:17 UTC on the 1st of each month. Off the hour on purpose: GitHub
    # queues scheduled runs, and the top of the hour is the busiest slot.
    - cron: "17 4 1 * *"
  workflow_dispatch:

# Enough to push the branch, open the pull request and merge it.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wordlist-refresh
  cancel-in-progress: false

env:
  BRANCH: chore/refresh-wordlist
  WORDLIST: apps/frontend/src/lib/wordlist/english-words.txt
  # GITHUB_TOKEN cannot start a workflow run, so a pull request it opens never
  # gets the `check` status that the develop ruleset requires, and auto-merge
  # waits on it forever. Set the WORDLIST_PR_TOKEN secret to a personal access
  # token (contents: write, pull requests: write) and the branch push and pull
  # request come from that identity instead, CI runs normally, and the merge
  # happens on its own. Without it the pull request still opens and waits for
  # a human.
  GH_TOKEN: ${{ secrets.WORDLIST_PR_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Also sets pipefail, so a failing generator is not masked by `tee`.
        shell: bash
    steps:
      # Third-party actions are pinned to full commit SHAs, not tags — tags
      # are mutable and this repository is public.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Kept for the later `git push`, so the branch is pushed as whoever
          # GH_TOKEN belongs to.
          token: ${{ secrets.WORDLIST_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # The generator has no dependencies, so it runs before the install: most
      # months upstream has not moved and the job stops at the next step. It
      # exits non-zero if either source changes shape or returns an
      # implausibly short list.
      - name: Regenerate word list
        run: |
          node --experimental-strip-types \
            apps/frontend/scripts/generate-wordlist.ts | tee /tmp/wordlist-report.txt

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- "$WORDLIST"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream has not changed the word list." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Fails the refresh before it proposes anything, so a word list that
      # breaks the build never reaches a pull request. It also stands in for CI
      # when there is no WORDLIST_PR_TOKEN and nothing else checks the change.
      - name: Verify the frontend builds
        if: steps.changes.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter frontend build

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          # A manual run proposes the change against whatever branch it was
          # dispatched from; the monthly run therefore targets the default one.
          BASE: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -qm "chore(frontend): refresh the English word list" -- "$WORDLIST"

          # A fixed branch, force-pushed: if a previous month's pull request is
          # somehow still open, this updates it instead of stacking up.
          git push -qf -u origin "$BRANCH"

          {
            echo "Regenerated from upstream by the monthly \`Refresh word list\` workflow."
            echo
            echo '```'
            cat /tmp/wordlist-report.txt
            echo '```'
            echo
            echo "Lines changed: $(git diff --numstat HEAD~1 HEAD -- "$WORDLIST" | awk '{print "+" $1 " / -" $2}')"
            echo
            echo "The frontend was built against this list before the pull request was opened."
          } > /tmp/pr-body.md

          cat /tmp/pr-body.md >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base "$BASE" \
              --head "$BRANCH" \
              --title "chore(frontend): refresh the English word list" \
              --body-file /tmp/pr-body.md
          else
            # The force-push already updated the open pull request's diff; only
            # its description needs to catch up.
            gh pr edit "$BRANCH" --body-file /tmp/pr-body.md
          fi

      - name: Merge pull request
        if: steps.changes.outputs.changed == 'true'
        run: |
          # Queued rather than merged outright, so the required `check` status
          # still gates the merge: this waits for CI instead of going around
          # it. GitHub rejects auto-merge on a pull request that is already
          # clean with nothing to wait for, hence the plain merge after it.
          if gh pr merge "$BRANCH" --squash --auto; then
            echo "Auto-merge queued; GitHub merges once \`check\` passes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh pr merge "$BRANCH" --squash
